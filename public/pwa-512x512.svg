<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89B3C" />
      <stop offset="50%" stop-color="#AF842D" />
      <stop offset="100%" stop-color="#7C4B18" />
    </linearGradient>
    <radialGradient id="goldPlate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDF8ED" />
      <stop offset="70%" stop-color="#F4EBD8" />
      <stop offset="100%" stop-color="#E2CCA6" />
    </radialGradient>
  </defs>

  <!-- Full bleed background for Android squircle safe-zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer gold dashed ring -->
  <circle cx="256" cy="256" r="215.04" fill="none" stroke="#F4EBD8" stroke-width="7.68" stroke-dasharray="10.24 7.68" opacity="0.9" />

  <!-- Inner Cream Plate -->
  <circle cx="256" cy="256" r="189.2352" fill="url(#goldPlate)" stroke="#AF842D" stroke-width="5.12" />

  <!-- Wheat stalk wreath decorative arc -->
  <path d="M 174.28480000000002 195.78879999999998 C 212.992 148.48000000000002 299.008 148.48000000000002 337.7152 195.78879999999998" fill="none" stroke="#AF842D" stroke-width="6.144" stroke-linecap="round" />

  <!-- HALWA Brand Typography -->
  <text x="256" y="274.04" font-family="serif, Georgia" font-size="82" font-weight="bold" fill="#5A3623" text-anchor="middle" letter-spacing="1">HALWA</text>
  <text x="256" y="301.92" font-family="sans-serif, Arial" font-size="30" font-weight="900" fill="#AF842D" text-anchor="middle" letter-spacing="5.12">BAKERY</text>

  <!-- Halal pill -->
  <rect x="159.232" y="315.04" width="193.536" height="43.2" rx="21.6" fill="#5A3623" />
  <text x="256" y="346.24" font-family="sans-serif, Arial" font-size="24" font-weight="bold" fill="#F4EBD8" text-anchor="middle" letter-spacing="0.5">100% HALAL</text>
</svg>