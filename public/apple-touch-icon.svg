<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89B3C" />
      <stop offset="50%" stop-color="#AF842D" />
      <stop offset="100%" stop-color="#7C4B18" />
    </linearGradient>
    <radialGradient id="goldPlate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDF8ED" />
      <stop offset="70%" stop-color="#F4EBD8" />
      <stop offset="100%" stop-color="#E2CCA6" />
    </radialGradient>
  </defs>

  <!-- Full bleed background for Android squircle safe-zone -->
  <rect width="180" height="180" fill="url(#bgGrad)" />

  <!-- Outer gold dashed ring -->
  <circle cx="90" cy="90" r="75.6" fill="none" stroke="#F4EBD8" stroke-width="2.6999999999999997" stroke-dasharray="3.6 2.6999999999999997" opacity="0.9" />

  <!-- Inner Cream Plate -->
  <circle cx="90" cy="90" r="66.52799999999999" fill="url(#goldPlate)" stroke="#AF842D" stroke-width="1.8" />

  <!-- Wheat stalk wreath decorative arc -->
  <path d="M 61.272000000000006 68.832 C 74.88 52.2 105.12 52.2 118.728 68.832" fill="none" stroke="#AF842D" stroke-width="2.16" stroke-linecap="round" />

  <!-- HALWA Brand Typography -->
  <text x="90" y="96.38" font-family="serif, Georgia" font-size="29" font-weight="bold" fill="#5A3623" text-anchor="middle" letter-spacing="1">HALWA</text>
  <text x="90" y="106.24000000000001" font-family="sans-serif, Arial" font-size="11" font-weight="900" fill="#AF842D" text-anchor="middle" letter-spacing="1.8">BAKERY</text>

  <!-- Halal pill -->
  <rect x="55.980000000000004" y="110.88" width="68.03999999999999" height="14.4" rx="7.2" fill="#5A3623" />
  <text x="90" y="121.28" font-family="sans-serif, Arial" font-size="8" font-weight="bold" fill="#F4EBD8" text-anchor="middle" letter-spacing="0.5">100% HALAL</text>
</svg>