<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89B3C" />
      <stop offset="50%" stop-color="#AF842D" />
      <stop offset="100%" stop-color="#7C4B18" />
    </linearGradient>
    <radialGradient id="goldPlate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDF8ED" />
      <stop offset="70%" stop-color="#F4EBD8" />
      <stop offset="100%" stop-color="#E2CCA6" />
    </radialGradient>
  </defs>

  <!-- Full bleed background for Android squircle safe-zone -->
  <rect width="192" height="192" fill="url(#bgGrad)" />

  <!-- Outer gold dashed ring -->
  <circle cx="96" cy="96" r="80.64" fill="none" stroke="#F4EBD8" stroke-width="2.88" stroke-dasharray="3.84 2.88" opacity="0.9" />

  <!-- Inner Cream Plate -->
  <circle cx="96" cy="96" r="70.9632" fill="url(#goldPlate)" stroke="#AF842D" stroke-width="1.92" />

  <!-- Wheat stalk wreath decorative arc -->
  <path d="M 65.35679999999999 73.4208 C 79.872 55.68 112.128 55.68 126.64320000000001 73.4208" fill="none" stroke="#AF842D" stroke-width="2.3040000000000003" stroke-linecap="round" />

  <!-- HALWA Brand Typography -->
  <text x="96" y="102.82" font-family="serif, Georgia" font-size="31" font-weight="bold" fill="#5A3623" text-anchor="middle" letter-spacing="1">HALWA</text>
  <text x="96" y="113.36" font-family="sans-serif, Arial" font-size="11" font-weight="900" fill="#AF842D" text-anchor="middle" letter-spacing="1.92">BAKERY</text>

  <!-- Halal pill -->
  <rect x="59.711999999999996" y="118.32" width="72.57600000000001" height="16.2" rx="8.1" fill="#5A3623" />
  <text x="96" y="130.01999999999998" font-family="sans-serif, Arial" font-size="9" font-weight="bold" fill="#F4EBD8" text-anchor="middle" letter-spacing="0.5">100% HALAL</text>
</svg>