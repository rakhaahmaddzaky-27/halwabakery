<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="100%" height="100%">
  <!-- Background & Outer Border -->
  <rect x="8" y="8" width="264" height="384" rx="16" ry="16" fill="#FFFFFF" stroke="#672278" stroke-width="8"/>
  
  <!-- Gunungan Wayang Halal Calligraphy Emblem -->
  <g fill="none" stroke="#672278" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Gunungan Arch / Body -->
    <path d="M 85 240 L 85 220 C 85 190 60 165 60 135 C 60 90 140 38 140 38 C 140 38 220 90 220 135 C 220 165 195 190 195 220 L 195 240 Z" />
    
    <!-- Base Foot (Alas Dudukan) -->
    <path d="M 85 240 L 85 252 L 195 252 L 195 240" />
    <path d="M 85 252 L 85 264 L 195 264 L 195 252" />

    <!-- Central Vertical Strokes (Calligraphy Lam-Alif) -->
    <!-- Left vertical spire -->
    <path d="M 105 235 L 105 130 C 105 105 140 65 140 65" />
    <!-- Center vertical spire -->
    <path d="M 130 235 L 130 75" />
    <!-- Right vertical spire -->
    <path d="M 155 235 L 155 85 C 155 85 180 115 180 140 L 180 235" />
    
    <!-- Inner curves forming Arabic letters Ha & Lam -->
    <path d="M 105 180 C 120 180 130 200 130 225" />
    <path d="M 155 180 C 140 180 130 200 130 225" />
  </g>

  <!-- Typography: HALAL -->
  <text x="140" y="306" 
        text-anchor="middle" 
        fill="#672278" 
        font-family="'Times New Roman', 'Playfair Display', serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="2">HALAL</text>

  <!-- Typography: INDONESIA -->
  <text x="140" y="330" 
        text-anchor="middle" 
        fill="#672278" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-weight="800" 
        font-size="14.5" 
        letter-spacing="4.5">INDONESIA</text>

  <!-- Typography: Certificate ID -->
  <text x="140" y="358" 
        text-anchor="middle" 
        fill="#672278" 
        font-family="'Plus Jakarta Sans', Arial, monospace" 
        font-weight="700" 
        font-size="13" 
        letter-spacing="1">ID64110055824640426</text>
</svg>
