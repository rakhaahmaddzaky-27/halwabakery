<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Halwa Bakery Emblem (Wheat & Arc) -->
  <g transform="translate(100, 115)">
    <!-- Arched curve -->
    <path d="M-65,18 C-60,-48 -24,-88 0,-88 C27,-88 58,-52 66,20" 
          fill="none" 
          stroke="#C89B3C" 
          stroke-width="5" 
          stroke-linecap="round" />
    
    <!-- Centered wheat stalk -->
    <g transform="translate(0, -52)">
      <!-- Main stem -->
      <line x1="0" y1="32" x2="0" y2="-24" stroke="#C89B3C" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Top tip -->
      <path d="M0,-24 C-3,-31 0,-37 0,-38 C0,-37 3,-31 0,-24 Z" fill="#C89B3C" />
      
      <!-- Wheat grains -->
      <path d="M0,-17 C-7,-22 -11,-15 -6,-10 C-3,-7 0,-11 0,-17 Z" fill="#C89B3C" />
      <path d="M0,-17 C7,-22 11,-15 6,-10 C3,-7 0,-11 0,-17 Z" fill="#C89B3C" />
      
      <path d="M0,-7 C-9,-13 -13,-6 -7,0 C-3,3 0,-1 0,-7 Z" fill="#C89B3C" />
      <path d="M0,-7 C9,-13 13,-6 7,0 C3,3 0,-1 0,-7 Z" fill="#C89B3C" />
      
      <path d="M0,4 C-10,-2 -14,5 -8,10 C-3,13 0,9 0,4 Z" fill="#C89B3C" />
      <path d="M0,4 C10,-2 14,5 8,10 C3,13 0,9 0,4 Z" fill="#C89B3C" />
      
      <path d="M0,15 C-10,9 -13,16 -7,21 C-3,24 0,20 0,15 Z" fill="#C89B3C" />
      <path d="M0,15 C10,9 13,16 7,21 C3,24 0,20 0,15 Z" fill="#C89B3C" />
    </g>
  </g>
</svg>
